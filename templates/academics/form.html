{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4"><h1 class="h3 mb-3">{{ heading }}</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a></form></div></div></div>{% endblock %}
