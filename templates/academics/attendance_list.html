{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h3">Attendance</h1><a class="btn btn-primary" href="{% url 'attendance_create' %}">+ Record attendance</a></div><div class="card p-3 table-responsive"><table class="table"><tr><th>Date</th><th>Student</th><th>Subject</th><th>Status</th></tr>{% for a in records %}<tr><td>{{ a.date }}</td><td>{{ a.student.full_name }}</td><td>{{ a.subject.name }}</td><td>{{ a.get_status_display }}</td></tr>{% empty %}<tr><td colspan="4">No attendance records.</td></tr>{% endfor %}</table></div>{% endblock %}
