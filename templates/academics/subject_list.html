{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h3">Subjects</h1><a class="btn btn-primary" href="{% url 'subject_create' %}">Add subject</a></div><div class="card p-3"><table class="table"><thead><tr><th>Code</th><th>Subject</th><th>Maximum</th><th>Pass marks</th></tr></thead><tbody>{% for s in subjects %}<tr><td>{{ s.code }}</td><td>{{ s.name }}</td><td>{{ s.max_marks }}</td><td>{{ s.pass_marks }}</td></tr>{% empty %}<tr><td colspan="4">No subjects added.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
