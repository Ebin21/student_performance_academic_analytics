<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Academic Analytics{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{background:#f5f7fb}.navbar-brand{font-weight:700}.card{border:0;box-shadow:0 2px 12px #14285010}.metric{font-size:1.8rem;font-weight:700}.small-muted{color:#6c757d;font-size:.9rem}</style></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{% url 'dashboard' %}">Academic Analytics</a><div class="d-flex gap-3 align-items-center flex-wrap">{% if user.is_authenticated %}<a class="text-white" href="{% url 'dashboard' %}">Dashboard</a><a class="text-white" href="{% url 'student_list' %}">Students</a><a class="text-white" href="{% url 'subject_list' %}">Subjects</a><a class="text-white" href="{% url 'assessment_list' %}">Marks</a><span class="text-white-50">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button></form>{% endif %}</div></div></nav><main class="container py-4">{% if messages %}{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% block scripts %}{% endblock %}</body></html>
