{% extends "base.html" %}{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-5"><div class="card p-4"><h1 class="h4">Sign in</h1>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form></div></div></div>{% endblock %}
