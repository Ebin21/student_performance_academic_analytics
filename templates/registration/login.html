{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-5"><div class="card p-4"><h1 class="h4">Sign in</h1><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" name="username" id="id_username" required></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" name="password" id="id_password" required></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100">Login</button></form></div></div></div>{% endblock %}
